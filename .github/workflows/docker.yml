name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t lean-lsp-mcp:smoke .
      - run: docker run --rm -i --network none --entrypoint python lean-lsp-mcp:smoke < docker/smoke_test.py
      - run: docker run --rm --network none lean-lsp-mcp:smoke --version
